version: "1"
description: >
  Seed lexicon for One Health L1 classification. Matching is token-based,
  so drain does not match drainage. Unknown values are handled in code and
  never map to Environmental.
l1:
  - Human
  - Animal
  - Environmental
  - Food
  - Laboratory
  - Unclassified
paper_rollup:
  Human: Human
  Animal: Animal
  Environmental: Environmental
  Food: Environmental
  Laboratory: Environmental
  Unclassified: Unclassified
  healthcare_environment_yes: Environmental
rules:
  # --- paper edge cases (high priority) ---
  - id: wound-drainage
    fields: [isolation_source, sample_type]
    phrases:
      - wound drainage
      - wound drainages
      - surgical drainage
      - abdominal drainage
      - chest drainage
      - drain fluid
      - drainage fluid
    l1: Human
    healthcare_environment: "no"
    priority: 95
    note: Clinical wound or surgical fluid. Not a hospital drain.

  - id: hospital-drain
    fields: [isolation_source, sample_type]
    phrases:
      - hospital drain
      - sink drain
      - shower drain
      - floor drain
      - ward drain
      - icu drain
      - bathroom drain
      - drain biofilm
      - drain water
      - sink trap
      - p-trap
      - ptrap
    l1: Environmental
    healthcare_environment: "yes"
    priority: 95
    note: Built-environment drain fixture, not wound drainage.

  - id: clinical-environment
    fields: [isolation_source, sample_type]
    phrases:
      - clinical environment
      - clinical env
      - hospital environment
      - healthcare environment
      - healthcare env
      - hospital surface
      - hospital sink
      - ward environment
      - icu environment
      - clinical setting
    l1: Environmental
    healthcare_environment: "yes"
    priority: 92

  - id: clinical-exact
    fields: [isolation_source]
    exact: [clinical, clinical isolate, clinical isolates]
    l1: Environmental
    healthcare_environment: "yes"
    priority: 90
    note: Bare clinical/clinical isolate is a healthcare-environment label, not a human specimen.

  # --- human clinical specimens ---
  - id: human-specimens
    fields: [isolation_source, sample_type]
    phrases:
      - blood
      - serum
      - plasma
      - urine
      - sputum
      - stool
      - feces
      - faeces
      - csf
      - cerebrospinal
      - bal
      - bronchoalveolar
      - wound swab
      - wound
      - pus
      - abscess
      - bronchial
      - bronchial lavage
      - bronchial wash
      - hospital carriage
      - patient carriage
      - nasal carriage
      - rectal carriage
      - gut carriage
      - asymptomatic carriage
      - rectal swab
      - nasal swab
      - throat swab
      - tissue
      - biopsy
      - peritoneal
      - pleural
      - bile
      - catheter tip
      - tracheal
      - sputum
    l1: Human
    healthcare_environment: "no"
    priority: 80

  # --- healthcare environment fixtures ---
  - id: healthcare-fixtures
    fields: [isolation_source, sample_type]
    phrases:
      - hospital sink
      - icu sink
      - ward sink
      - clinical sink
      - healthcare sink
      - hospital faucet
      - icu faucet
      - ward faucet
      - clinical faucet
      - healthcare faucet
      - hospital tap
      - icu tap
      - ward tap
      - tap water hospital
      - bedside
      - ventilator
      - hospital wastewater
      - hospital sewage
      - hospital floor
      - hospital surface
      - hospital water
    l1: Environmental
    healthcare_environment: "yes"
    priority: 85
    note: Bare sink or faucet is not a hospital fixture. Those stay unmatched.

  # --- KlebNET animal source types that contain the word food ---
  - id: animal-food-producing
    fields: [isolation_source, sample_type, host]
    phrases:
      - animal food producing
      - food producing animal
      - food producing animals
      - food-producing animal
      - food-producing animals
    l1: Animal
    healthcare_environment: "no"
    priority: 88
    note: KlebNET Animal - food producing is livestock, not Food.

  # --- food ---
  - id: food-products
    fields: [isolation_source, sample_type, host]
    phrases:
      - food
      - retail meat
      - chicken meat
      - ground beef
      - minced beef
      - pork meat
      - carcass
      - lettuce
      - salad
      - cheese
      - milk
      - dairy
      - flour
      - spice
      - produce
      - vegetable
      - fruit
      - seafood product
    l1: Food
    healthcare_environment: "no"
    priority: 75

  # --- laboratory ---
  - id: laboratory
    fields: [isolation_source, sample_type, host]
    phrases:
      - laboratory
      - lab strain
      - laboratory strain
      - type strain
      - reference strain
      - culture collection
      - in vitro
      - lab culture
      - experimentally derived
      - experimentally-derived
    exact: [laboratory, lab, type strain]
    l1: Laboratory
    healthcare_environment: "no"
    priority: 70

  # --- outdoor / non-healthcare environment ---
  - id: environment-outdoor
    fields: [isolation_source, sample_type]
    phrases:
      - river
      - lake
      - seawater
      - marine
      - sediment
      - soil
      - wastewater
      - sewage
      - sludge
      - effluent
      - surface water
      - fresh water
      - freshwater
      - groundwater
      - well water
      - irrigation
      - compost
      - air
    l1: Environmental
    healthcare_environment: "no"
    priority: 70

  - id: environment-generic
    fields: [isolation_source]
    exact: [environment, environmental, environmental sample]
    l1: Environmental
    healthcare_environment: "no"
    priority: 60

  # --- animal hosts and sites ---
  - id: animal-hosts
    fields: [host, isolation_source]
    phrases:
      - gallus gallus
      - chicken
      - poultry
      - broiler
      - bos taurus
      - cattle
      - bovine
      - cow
      - calf
      - sus scrofa
      - pig
      - swine
      - porcine
      - canis
      - dog
      - canine
      - felis
      - cat
      - feline
      - equus
      - horse
      - equine
      - ovis aries
      - sheep
      - ovine
      - capra
      - goat
      - caprine
      - mus musculus
      - mouse
      - mice
      - rattus
      - rat
      - turkey
      - duck
      - fish
      - salmon
      - avian
      - bird
      - wildlife
      - livestock
      - companion
      - companion animal
      - companion animals
    l1: Animal
    healthcare_environment: "no"
    priority: 40

  - id: animal-sites
    fields: [isolation_source, sample_type]
    phrases:
      - cloaca
      - cloacal
      - milk tank
      - farm
      - barn
      - litter
      - manure
    l1: Animal
    healthcare_environment: "no"
    priority: 65

  # --- human host ---
  - id: human-host
    fields: [host]
    phrases:
      - homo sapiens
      - human
      - patient
    exact: [homo sapiens, human, patient, homo sapien]
    l1: Human
    healthcare_environment: "no"
    priority: 20
