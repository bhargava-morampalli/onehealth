version: "4"
description: >
  Seed lexicon for One Health L1 classification of isolation-source metadata.
  Unknown values are handled in code and never map to Environmental.
  v3 (November 2026) adds terms found in the review queues of the IMP benchmark
  and the NCBI Pathogen Detection test data; additions are marked "v3".
  v4 (November 2026) sends a fixture named without its setting ("Rm 14 Drain",
  "Sink swab") to review even when the host is Homo sapiens; changes are marked
  "v4". See CHANGELOG.md.

# How rules are applied (classify.py):
#   * Matching is on lower-case word tokens, so "drain" does not match "drainage".
#     `exact` must equal the whole field value; `phrases` may appear anywhere in it.
#   * The highest-priority hit wins. Different L1 (or healthcare flag) at the same
#     priority is a rule_conflict and goes to review.
#   * host_dependent: true marks a body site or specimen that occurs in any host
#     (blood, urine, faeces, "clinical"). A recognised animal (host or word) makes the
#     call Animal; a human host makes it Human; both is a conflict; a host the lexicon
#     does not recognise (e.g. a plant) is review. With no host at all, `l1` is used.
#   * l1: Unclassified sends a match to review (e.g. animal feed).
#   * The paper rollup is fixed in code (constants.derive_paper_rollup), not here.
#   * A bare scientific name in isolation_source ("Bos taurus") is ignored. The
#     guess is by word shape, so a rule that does not read `host` still matches a
#     phrase such as "bedpan washer". In a rule that reads `host`, a 2-3 word phrase
#     that looks like a Latin binomial is treated as a species name in
#     isolation_source. tests/test_lexicon.py checks the seed lexicon.
rules:
  # --- send to review ---
  - id: animal-feed
    fields: [isolation_source, sample_type]
    phrases:
      - animal feed
      - livestock feed
      - cattle feed
      - poultry feed
      - swine feed
      - pig feed
      - chicken feed
      - fish feed
    l1: Unclassified
    healthcare_environment: "no"
    priority: 99
    note: KlebNET animal feed is neither retail Food nor an animal sample. Review.

  # --- paper edge cases (high priority) ---
  - id: wound-drainage
    fields: [isolation_source, sample_type]
    phrases:
      - wound drainage
      - wound drainages
      - surgical drainage
      - abdominal drainage
      - chest drainage
      - drain fluid
      - drainage fluid
    l1: Human
    healthcare_environment: "no"
    priority: 95
    host_dependent: true
    note: Clinical wound or surgical fluid. Not a hospital drain.

  - id: hospital-drain
    fields: [isolation_source, sample_type]
    phrases:
      - hospital drain
      - sink drain
      - shower drain
      - floor drain
      - ward drain
      - icu drain
      - bathroom drain
      - drain biofilm
      - drain water
      - sink trap
      - p-trap
      - ptrap
      # v3: plurals. Matching is by whole word, so "sink drains" never matched "sink drain".
      - hospital drains
      - sink drains
      - shower drains
      - floor drains
      - ward drains
      - icu drains
      - bathroom drains
      - sink traps
    l1: Environmental
    healthcare_environment: "yes"
    priority: 95
    note: >
      Built-environment drain fixture, not wound drainage. Unqualified drains
      (sink drain, floor drain) are assumed to be in a healthcare setting. If a
      dataset mixes hospitals with food plants, require a hospital word.

  - id: clinical-environment
    fields: [isolation_source, sample_type]
    phrases:
      - clinical environment
      - clinical env
      - hospital environment
      - healthcare environment
      - healthcare env
      - ward environment
      - icu environment
      - clinical setting
    l1: Environmental
    healthcare_environment: "yes"
    priority: 92

  # --- veterinary clinical source that contains a food word ---
  - id: animal-food-producing
    fields: [isolation_source, sample_type, host]
    phrases:
      - animal food producing
      - food producing animal
      - food producing animals
      - food-producing animal
      - food-producing animals
    l1: Animal
    healthcare_environment: "no"
    priority: 88
    note: KlebNET Animal - food producing is livestock, not Food.

  - id: animal-mastitis
    fields: [isolation_source, sample_type, host_disease]
    phrases:
      - mastitis
      - mastitic
    l1: Animal
    healthcare_environment: "no"
    priority: 88
    note: >
      Klebsiella and E. coli are leading causes of bovine clinical mastitis, so
      "mastitis milk" is a veterinary clinical sample, not retail Food. A human
      host still makes this a host_source_conflict.

  # --- healthcare environment fixtures ---
  - id: healthcare-fixtures
    fields: [isolation_source, sample_type]
    phrases:
      - hospital sink
      - icu sink
      - ward sink
      - clinical sink
      - healthcare sink
      - hospital faucet
      - icu faucet
      - ward faucet
      - clinical faucet
      - healthcare faucet
      - hospital tap
      - icu tap
      - ward tap
      - tap water hospital
      - bedside
      - ventilator tubing
      - ventilator circuit
      - hospital wastewater
      - hospital sewage
      - hospital effluent
      - hospital floor
      - hospital surface
      - hospital water
      - hospital air
      # v3: "waste water" in two words; bedpans and bedpan washers are hospital equipment.
      - hospital waste water
      - bedpan
    exact: [ventilator]
    l1: Environmental
    healthcare_environment: "yes"
    priority: 85
    note: >
      Bare sink or faucet is not a hospital fixture; those stay unmatched.
      "ventilator" is exact-only so ventilator-associated pneumonia is not a fixture.

  # --- specimens and body sites (any host) ---
  - id: clinical-sample
    fields: [isolation_source]
    exact:
      - clinical
      - clinical isolate
      - clinical isolates
      - clinical sample
      - clinical samples
      - clinical specimen
      - clinical specimens
    l1: Human
    healthcare_environment: "no"
    priority: 80
    host_dependent: true
    note: >
      NCBI uses "clinical" for host-associated patient samples (BioSample package
      Pathogen.cl, "clinical or host-associated"). It is not an environmental swab.

  - id: specimens
    fields: [isolation_source, sample_type]
    phrases:
      - blood
      - serum
      - plasma
      - urine
      - sputum
      - stool
      - feces
      - faeces
      - csf
      - cerebrospinal
      - bal
      - bronchoalveolar
      - bronchial
      - tracheal
      - wound
      - pus
      - abscess
      - tissue
      - biopsy
      - peritoneal
      - pleural
      - bile
      # v3: any catheter specimen, not only "catheter tip"; and diagnoses such as
      # "urinary tract infection", which describe a patient (or animal) sample.
      - catheter
      - tract infection
      - breast milk
      - rectal swab
      - nasal swab
      - throat swab
      - hospital carriage
      - patient carriage
      - nasal carriage
      - rectal carriage
      - gut carriage
      - asymptomatic carriage
      # v4: a surgical drain's tip is a patient specimen, like a catheter tip. Listed here
      # so that the fixture-no-setting rule below does not send it to review.
      - drain tip
      - drain tips
    l1: Human
    healthcare_environment: "no"
    priority: 80
    host_dependent: true
    note: Anatomical sites are species-neutral (Uberon); the host decides Human vs Animal.

  # --- food ---
  - id: food-products
    fields: [isolation_source, sample_type, host]
    phrases:
      - food
      - meat
      - retail
      - ground beef
      - minced beef
      - carcass
      - lettuce
      - salad
      - cheese
      - milk
      - dairy product
      - dairy products
      - flour
      - spice
      - produce
      - vegetable
      - fruit
      - seafood product
      - seafood products
    l1: Food
    healthcare_environment: "no"
    priority: 75
    note: >
      Bare "dairy" is not used because "dairy farm" and "dairy cattle" are animal
      settings, not food products.

  # --- laboratory ---
  - id: laboratory
    fields: [isolation_source, sample_type, host]
    phrases:
      - laboratory
      - lab strain
      - laboratory strain
      - type strain
      - reference strain
      - culture collection
      - in vitro
      - lab culture
      - experimentally derived
      - experimentally-derived
      # v3: passaging (serial passage) in the laboratory. Not "serial passage" itself:
      # this rule also reads host, and two plain words would be taken for a species name.
      - passaging
    exact: [lab]
    l1: Laboratory
    healthcare_environment: "no"
    priority: 70

  # --- outdoor / non-healthcare environment ---
  - id: environment-outdoor
    fields: [isolation_source, sample_type]
    phrases:
      - river
      - lake
      - seawater
      - sea water
      - marine water
      - sediment
      - soil
      - wastewater
      - sewage
      - sludge
      - effluent
      - surface water
      - fresh water
      - freshwater
      - groundwater
      - well water
      - irrigation
      - compost
      - air sample
      - ambient air
      - indoor air
      - outdoor air
      # v3: "waste water" in two words, and wastewater treatment plant samples.
      - waste water
      - wastewater treatment
      - wwtp
      - influent
    exact: [air, water]
    l1: Environmental
    healthcare_environment: "no"
    priority: 70
    note: >
      Bare "air" and "marine" are not phrases: they also occur in "air sac"
      (poultry colibacillosis specimen) and "marine fish" / "marine mammal".

  - id: environment-generic
    fields: [isolation_source, sample_type]
    exact: [environment, environmental, environmental sample, environmental samples, environmental swab, environmental swabs]
    l1: Environmental
    healthcare_environment: "no"
    priority: 60

  # --- animal settings ---
  - id: animal-sites
    fields: [isolation_source, sample_type]
    phrases:
      - cloaca
      - cloacal
      - farm
      - barn
      - litter
      - manure
    l1: Animal
    healthcare_environment: "no"
    priority: 65

  # --- animal hosts ---
  - id: animal-hosts
    fields: [host, isolation_source, sample_type]
    phrases:
      - animal
      - gallus gallus
      - chicken
      - poultry
      - broiler
      - bos taurus
      - cattle
      - bovine
      - cow
      - calf
      - sus scrofa
      - pig
      - swine
      - porcine
      - canis
      - dog
      - canine
      - felis
      - cat
      - feline
      - equus
      - horse
      - equine
      - ovis aries
      - sheep
      - ovine
      - capra
      - goat
      - caprine
      - mus musculus
      - mouse
      - mice
      - rattus
      - rat
      - meleagris gallopavo
      - turkey
      - anas platyrhynchos
      - duck
      - oryctolagus cuniculus
      - rabbit
      - fish
      - salmon
      - avian
      - bird
      - wildlife
      - livestock
      - companion
    l1: Animal
    healthcare_environment: "no"
    priority: 40

  # --- v4: a fixture with no setting ---
  - id: fixture-no-setting
    fields: [isolation_source, sample_type]
    phrases:
      - drain
      - drains
      - sink
      - sinks
      - trap
      - traps
      - shower
      - showers
      - faucet
      - faucets
      - toilet
      - toilets
      - basin
      - basins
      - washbasin
      - plughole
      - bathroom
      - bathrooms
    l1: Unclassified
    healthcare_environment: "no"
    priority: 30
    note: >
      A fixture on its own ("Rm 14 Drain", "Sink swab", "Shower 3") says neither whose sample
      it is nor where the fixture is. Submitters often record host Homo sapiens for hospital
      fixture swabs, so without this rule the human-host rule below would call them Human.
      Review instead. Any higher rule still decides: "sink drain" and "hospital sink" are
      healthcare environment, "drain tip" is a specimen, and an animal host still makes it
      Animal, as other farm settings do.

  # --- human host ---
  - id: human-host
    fields: [host, sample_type]
    phrases:
      - homo sapiens
      - homo sapien
      - human
      - patient
    l1: Human
    healthcare_environment: "no"
    priority: 20
    note: >
      Also reads NCBI source_type "human" (via sample_type). Not applied to
      isolation_source, where "patient room surface" is a healthcare-environment swab.

  - id: human-source
    fields: [isolation_source]
    exact: [human, human sample, patient, patient sample]
    l1: Human
    healthcare_environment: "no"
    priority: 20
    note: >
      v3. An isolation_source that is only "human" or "patient" names the host.
      Exact matches only: "patient room surface" is a healthcare-environment swab.
      With an animal host it is a host_source_conflict.
