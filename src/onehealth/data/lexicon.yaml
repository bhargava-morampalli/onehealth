version: "6"
description: >
  Seed lexicon for One Health L1 classification of isolation-source metadata.
  Unknown values are handled in code and never map to Environmental.
  v3 (November 2026) adds terms found in the review queues of the IMP benchmark
  and the NCBI Pathogen Detection test data; additions are marked "v3".
  v4 (November 2026) sends a fixture named without its setting ("Rm 14 Drain",
  "Sink swab") to review even when the host is Homo sapiens; changes are marked
  "v4".
  v5 (November 2026) stops calling retail meat Animal ("ground turkey", "chicken breast")
  and food-plant swabs Food ("non-food-contact surface"); changes are marked "v5". The
  terms come from NCBI Pathogen Detection records whose submitters also filled in NCBI's
  own source_type (tests/data/ncbi_pd_source_types). See CHANGELOG.md.
  v6 (November 2026) recognises a host the word lists do not name, by the names NCBI
  Taxonomy gives to animals ("gull", "Macaca mulatta", "Bubalus bubalis"); changes are
  marked "v6". It also reads "human" in a specimen's own text ("human feces").
  This is the only lexicon that ships. Earlier versions are in the repository history;
  when this file changes, raise `version` here and SEED_LEXICON_VERSION in constants.py.

# How rules are applied (classify.py):
#   * Matching is on lower-case word tokens, so "drain" does not match "drainage".
#     `exact` must equal the whole field value; `phrases` may appear anywhere in it.
#   * The highest-priority hit wins. Different L1 (or healthcare flag) at the same
#     priority is a rule_conflict and goes to review.
#   * host_dependent: true marks a body site or specimen that occurs in any host
#     (blood, urine, faeces, "clinical"). A recognised animal (host or word) makes the
#     call Animal; a human host makes it Human; both is a conflict; a host the lexicon
#     does not recognise (e.g. a plant) is review. With no host at all, `l1` is used.
#   * l1: Unclassified sends a match to review (e.g. animal feed).
#   * taxonomy: animal (or human) makes a rule match a field whose whole value is a
#     name NCBI Taxonomy gives to an animal (or to people), as well as its phrases.
#   * specimen_only: true marks a rule that only says whose specimen it is. It decides
#     Human or Animal for a specimen rule on the same row and is ignored otherwise.
#   * The paper rollup is fixed in code (constants.derive_paper_rollup), not here.
#   * A bare scientific name in isolation_source ("Bos taurus") is ignored. The
#     guess is by word shape, so a rule that does not read `host` still matches a
#     phrase such as "bedpan washer". In a rule that reads `host`, a 2-3 word phrase
#     that looks like a Latin binomial is treated as a species name in
#     isolation_source. tests/test_lexicon.py checks the seed lexicon.
rules:
  # --- send to review ---
  - id: animal-feed
    fields: [isolation_source, sample_type]
    phrases:
      - animal feed
      - livestock feed
      - cattle feed
      - poultry feed
      - swine feed
      - pig feed
      - chicken feed
      - fish feed
    l1: Unclassified
    healthcare_environment: "no"
    priority: 99
    note: KlebNET animal feed is neither retail Food nor an animal sample. Review.

  # --- paper edge cases (high priority) ---
  - id: wound-drainage
    fields: [isolation_source, sample_type]
    phrases:
      - wound drainage
      - wound drainages
      - surgical drainage
      - abdominal drainage
      - chest drainage
      - drain fluid
      - drainage fluid
    l1: Human
    healthcare_environment: "no"
    priority: 95
    host_dependent: true
    note: Clinical wound or surgical fluid. Not a hospital drain.

  - id: hospital-drain
    fields: [isolation_source, sample_type]
    phrases:
      - hospital drain
      - sink drain
      - shower drain
      - floor drain
      - ward drain
      - icu drain
      - bathroom drain
      - drain biofilm
      - drain water
      - sink trap
      - p-trap
      - ptrap
      # v3: plurals. Matching is by whole word, so "sink drains" never matched "sink drain".
      - hospital drains
      - sink drains
      - shower drains
      - floor drains
      - ward drains
      - icu drains
      - bathroom drains
      - sink traps
    l1: Environmental
    healthcare_environment: "yes"
    priority: 95
    note: >
      Built-environment drain fixture, not wound drainage. Unqualified drains
      (sink drain, floor drain) are assumed to be in a healthcare setting. If a
      dataset mixes hospitals with food plants, require a hospital word.

  - id: clinical-environment
    fields: [isolation_source, sample_type]
    phrases:
      - clinical environment
      - clinical env
      - hospital environment
      - healthcare environment
      - healthcare env
      - ward environment
      - icu environment
      - clinical setting
    l1: Environmental
    healthcare_environment: "yes"
    priority: 92

  # --- veterinary clinical source that contains a food word ---
  - id: animal-food-producing
    fields: [isolation_source, sample_type, host]
    phrases:
      - animal food producing
      - food producing animal
      - food producing animals
      - food-producing animal
      - food-producing animals
      # v5: "food animal" is livestock too.
      - food animal
      - food animals
    l1: Animal
    healthcare_environment: "no"
    priority: 88
    note: KlebNET Animal - food producing is livestock, not Food.

  - id: animal-mastitis
    fields: [isolation_source, sample_type, host_disease]
    phrases:
      - mastitis
      - mastitic
    l1: Animal
    healthcare_environment: "no"
    priority: 88
    note: >
      Klebsiella and E. coli are leading causes of bovine clinical mastitis, so
      "mastitis milk" is a veterinary clinical sample, not retail Food. A human
      host still makes this a host_source_conflict.

  # --- healthcare environment fixtures ---
  - id: healthcare-fixtures
    fields: [isolation_source, sample_type]
    phrases:
      - hospital sink
      - icu sink
      - ward sink
      - clinical sink
      - healthcare sink
      - hospital faucet
      - icu faucet
      - ward faucet
      - clinical faucet
      - healthcare faucet
      - hospital tap
      - icu tap
      - ward tap
      - tap water hospital
      - bedside
      - ventilator tubing
      - ventilator circuit
      - hospital wastewater
      - hospital sewage
      - hospital effluent
      - hospital floor
      - hospital surface
      - hospital water
      - hospital air
      # v3: "waste water" in two words; bedpans and bedpan washers are hospital equipment.
      - hospital waste water
      - bedpan
    exact: [ventilator]
    l1: Environmental
    healthcare_environment: "yes"
    priority: 85
    note: >
      Bare sink or faucet is not a hospital fixture; those stay unmatched.
      "ventilator" is exact-only so ventilator-associated pneumonia is not a fixture.

  # --- specimens and body sites (any host) ---
  - id: clinical-sample
    fields: [isolation_source]
    exact:
      - clinical
      - clinical isolate
      - clinical isolates
      - clinical sample
      - clinical samples
      - clinical specimen
      - clinical specimens
    l1: Human
    healthcare_environment: "no"
    priority: 80
    host_dependent: true
    note: >
      NCBI uses "clinical" for host-associated patient samples (BioSample package
      Pathogen.cl, "clinical or host-associated"). It is not an environmental swab.

  - id: specimens
    fields: [isolation_source, sample_type]
    phrases:
      - blood
      - serum
      - plasma
      - urine
      - sputum
      - stool
      - feces
      - faeces
      # v5: other spellings of the same specimens.
      - fecal
      - faecal
      - stools
      - csf
      - cerebrospinal
      - bal
      - bronchoalveolar
      - bronchial
      - tracheal
      - wound
      - pus
      - abscess
      - tissue
      - biopsy
      - peritoneal
      - pleural
      - bile
      # v3: any catheter specimen, not only "catheter tip"; and diagnoses such as
      # "urinary tract infection", which describe a patient (or animal) sample.
      - catheter
      - tract infection
      - breast milk
      - rectal swab
      - nasal swab
      - throat swab
      - hospital carriage
      - patient carriage
      - nasal carriage
      - rectal carriage
      - gut carriage
      - asymptomatic carriage
      # v4: a surgical drain's tip is a patient specimen, like a catheter tip. Listed here
      # so that the fixture-no-setting rule below does not send it to review.
      - drain tip
      - drain tips
    l1: Human
    healthcare_environment: "no"
    priority: 80
    host_dependent: true
    note: Anatomical sites are species-neutral (Uberon); the host decides Human vs Animal.

  # --- v5: swabs of surfaces and food premises; people who handle food ---
  - id: environmental-sampling
    fields: [isolation_source, sample_type]
    phrases:
      - environmental swab
      - environmental swabs
      - environmental sponge
      - environmental sponges
      - swab sponge
      - food contact
      - contact surface
      - contact surfaces
      - food processing
      - food production
      - food establishment
      - processing environment
      - production environment
      - processing plant
      - processing facility
      - processing establishment
    l1: Environmental
    healthcare_environment: "no"
    priority: 78
    note: >
      v5. A swab or sponge of a surface, or a sample of the premises where food is made,
      is an environmental sample even when its text names the food or the animal
      ("environmental swab sponge non food contact", "meat processing plant"). Above the
      food rules (75) and below specimens (80). In the development split of
      tests/data/ncbi_pd_source_types, "environmental swab" is environmental by NCBI's
      source_type 3,139 times in 3,144, and "food contact" 204 times in 215.

  - id: food-handler
    fields: [isolation_source, sample_type]
    phrases:
      - food handler
      - food handlers
      - food worker
      - food workers
    l1: Human
    healthcare_environment: "no"
    priority: 78
    note: >
      v5. A person, not a food. "food handler stool" is a specimen as before; an animal
      host makes this a host_source_conflict.

  # --- food ---
  - id: food-products
    fields: [isolation_source, sample_type, host]
    phrases:
      - food
      - meat
      - retail
      - ground beef
      - minced beef
      - carcass
      - lettuce
      - salad
      - cheese
      - milk
      - dairy product
      - dairy products
      - flour
      - spice
      - produce
      - vegetable
      - fruit
      - seafood product
      - seafood products
    l1: Food
    healthcare_environment: "no"
    priority: 75
    note: >
      Bare "dairy" is not used because "dairy farm" and "dairy cattle" are animal
      settings, not food products.

  - id: food-items
    fields: [isolation_source, sample_type]
    phrases:
      # How meat and poultry are sold or processed. These words win over the species
      # ("comminuted chicken", "ground turkey"), which on its own still means the animal.
      - comminuted
      - nonintact
      - raw intact
      - product raw
      - raw ground
      - ground turkey
      - ground chicken
      - ground pork
      - ground lamb
      - ground veal
      - ground component
      - boneless
      - skinless
      - tenderloin
      - giblets
      - fillet
      - fillets
      - smoked
      - rte
      - ready to eat
      - fully cooked
      - raw chicken
      - raw turkey
      - raw pork
      - raw beef
      - raw fish
      - raw salmon
      - raw shrimp
      - whole chicken
      - whole turkey
      - chicken breast
      - chicken breasts
      - chicken thigh
      - chicken thighs
      - chicken wing
      - chicken wings
      - chicken leg
      - chicken legs
      - chicken drumstick
      - chicken drumsticks
      - turkey breast
      - pork
      - sausage
      - sausages
      - ham
      - bacon
      - salami
      - steak
      - hamburger
      - sandwich
      - fish product
      - fish products
      - poultry product
      - poultry products
      - pet treat
      - pet treats
      - dog treat
      - dog treats
      # Foods named in at least a dozen NCBI Pathogen Detection records (the development
      # split of tests/data/ncbi_pd_source_types), 93% or more of them labelled food by
      # their submitters.
      - shrimp
      - tuna
      - herring
      - tilapia
      - mussels
      - crabmeat
      - ice cream
      - butter
      - cheddar
      - curd
      - peanut
      - pistachio
      - nut
      - nuts
      - sesame
      - coconut
      - chocolate
      - avocado
      - papaya
      - cantaloupe
      - peach
      - nectarine
      - apple
      - tomato
      - cucumber
      - spinach
      - romaine
      - broccoli
      - celery
      - onion
      - garlic
      - cilantro
      - coriander
      - parsley
      - basil
      - chili
      - jalapeno
      - pepper
      - sprout
      - sprouts
      - mushroom
      - mushrooms
      - enoki
      - kratom
    l1: Food
    healthcare_environment: "no"
    priority: 75
    note: >
      v5. Reads source text only, so two-word foods ("peanut butter", "ice cream") are
      not taken for species names. Cuts are listed only with their animal ("chicken
      breast", not "breast"): a bare body part is as often a patient's. Organs are not
      listed at all: "chicken liver" is retail giblets or a necropsy sample.
      Not listed because NCBI records with them are too mixed: bare "beef" (a quarter
      are beef cattle), "egg", "seafood", "fish", "frozen", "raw".

  # --- laboratory ---
  - id: laboratory
    fields: [isolation_source, sample_type, host]
    phrases:
      - laboratory
      - lab strain
      - laboratory strain
      - type strain
      - reference strain
      - culture collection
      - in vitro
      - lab culture
      - experimentally derived
      - experimentally-derived
      # v3: passaging (serial passage) in the laboratory. Not "serial passage" itself:
      # this rule also reads host, and two plain words would be taken for a species name.
      - passaging
    exact: [lab]
    l1: Laboratory
    healthcare_environment: "no"
    priority: 70

  # --- outdoor / non-healthcare environment ---
  - id: environment-outdoor
    fields: [isolation_source, sample_type]
    phrases:
      - river
      - lake
      - seawater
      - sea water
      - marine water
      - sediment
      - soil
      - wastewater
      - sewage
      - sludge
      - effluent
      - surface water
      - fresh water
      - freshwater
      - groundwater
      - well water
      - irrigation
      - compost
      - air sample
      - ambient air
      - indoor air
      - outdoor air
      # v3: "waste water" in two words, and wastewater treatment plant samples.
      - waste water
      - wastewater treatment
      - wwtp
      - influent
    exact: [air, water]
    l1: Environmental
    healthcare_environment: "no"
    priority: 70
    note: >
      Bare "air" and "marine" are not phrases: they also occur in "air sac"
      (poultry colibacillosis specimen) and "marine fish" / "marine mammal".

  - id: environment-generic
    fields: [isolation_source, sample_type]
    exact: [environment, environmental, environmental sample, environmental samples, environmental swab, environmental swabs]
    l1: Environmental
    healthcare_environment: "no"
    priority: 60

  # --- animal settings ---
  - id: animal-sites
    fields: [isolation_source, sample_type]
    phrases:
      - cloaca
      - cloacal
      - farm
      - barn
      - litter
      - manure
    l1: Animal
    healthcare_environment: "no"
    priority: 65

  # --- animal hosts ---
  - id: animal-hosts
    fields: [host, isolation_source, sample_type]
    phrases:
      - animal
      - gallus gallus
      - chicken
      - poultry
      - broiler
      - bos taurus
      - cattle
      - bovine
      - cow
      - calf
      - sus scrofa
      - pig
      - swine
      - porcine
      - canis
      - dog
      - canine
      - felis
      - cat
      - feline
      - equus
      - horse
      - equine
      - ovis aries
      - sheep
      - ovine
      - capra
      - goat
      - caprine
      - mus musculus
      - mouse
      - mice
      - rattus
      - rat
      - meleagris gallopavo
      - turkey
      - anas platyrhynchos
      - duck
      - oryctolagus cuniculus
      - rabbit
      - fish
      - salmon
      - avian
      - bird
      - wildlife
      - livestock
      - companion
    l1: Animal
    healthcare_environment: "no"
    priority: 40

  # --- v6: any other animal host, by its name in NCBI Taxonomy ---
  - id: host-taxonomy
    fields: [host]
    taxonomy: animal
    l1: Animal
    healthcare_environment: "no"
    priority: 40
    note: >
      v6. The word list above names the hosts seen most often; no list covers every
      species. This rule matches a host whose whole value is a name NCBI Taxonomy gives
      to an animal: the scientific name of a chordate at any rank ("Larus dominicanus",
      "Macaca", "Cervidae"), a species with a subspecies or breed ("Bos primigenius
      taurus"), a genus with "sp.", or the common name of any animal ("gull", "sika
      deer", "mud crab"). Never a word inside a longer value. It reads host only: a
      species name in isolation_source is not a description of the sample. It comes
      after animal-hosts and has the same priority, so a host both rules know keeps the
      reason animal-hosts.
  - id: fixture-no-setting
    fields: [isolation_source, sample_type]
    phrases:
      - drain
      - drains
      - sink
      - sinks
      - trap
      - traps
      - shower
      - showers
      - faucet
      - faucets
      - toilet
      - toilets
      - basin
      - basins
      - washbasin
      - plughole
      - bathroom
      - bathrooms
    l1: Unclassified
    healthcare_environment: "no"
    priority: 30
    note: >
      A fixture on its own ("Rm 14 Drain", "Sink swab", "Shower 3") says neither whose sample
      it is nor where the fixture is. Submitters often record host Homo sapiens for hospital
      fixture swabs, so without this rule the human-host rule below would call them Human.
      Review instead. Any higher rule still decides: "sink drain" and "hospital sink" are
      healthcare environment, "drain tip" is a specimen, and an animal host still makes it
      Animal, as other farm settings do.

  # --- human host ---
  - id: human-host
    fields: [host, sample_type]
    phrases:
      - homo sapiens
      - homo sapien
      - human
      - patient
    l1: Human
    healthcare_environment: "no"
    priority: 20
    note: >
      Also reads NCBI source_type "human" (via sample_type). Not applied to
      isolation_source, where "patient room surface" is a healthcare-environment swab.

  - id: host-taxonomy-human
    fields: [host]
    taxonomy: human
    l1: Human
    healthcare_environment: "no"
    priority: 20
    note: >
      v6. The genus Homo however it is written: "Homo", "Homo sapiens sapiens". After
      human-host and with the same priority, so "Homo sapiens" keeps the reason human-host.

  - id: human-word
    fields: [isolation_source]
    phrases:
      - human
      - humans
    l1: Human
    healthcare_environment: "no"
    priority: 20
    specimen_only: true
    note: >
      v6. "human feces" and "human, blood culture" say whose specimen it is, as "pig
      feces" does. Before, only an animal word in a specimen's text counted, so these
      were Human by the no-host default, and went to review in a record filed as
      environmental. specimen_only, because on its own the word decides nothing: "human
      contact surface" and "human listeriosis" are not specimens. "patient" is not
      listed: a veterinary record has patients too.

  - id: human-source
    fields: [isolation_source]
    exact: [human, human sample, patient, patient sample]
    l1: Human
    healthcare_environment: "no"
    priority: 20
    note: >
      v3. An isolation_source that is only "human" or "patient" names the host.
      Exact matches only: "patient room surface" is a healthcare-environment swab.
      With an animal host it is a host_source_conflict.
