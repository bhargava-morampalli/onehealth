[project]
name = "onehealth"
version = "0.3.0"
description = "Classify mixed NCBI isolate IDs into One Health source categories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bhargava-morampalli", email = "morampalli.b@northeastern.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# scipy is used only by the tests, to check the statistics against an independent implementation.
# ruff and mypy are the checks the test workflow runs; types-PyYAML gives mypy yaml's types.
dev = ["pytest>=8.0", "scipy>=1.11", "ruff>=0.17,<0.18", "mypy>=2.4", "types-PyYAML>=6.0"]
# The documentation site (mkdocs.yml); not needed to use onehealth.
docs = ["mkdocs-material>=9.5"]

[project.scripts]
onehealth = "onehealth.cli:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.15.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0", "scipy>=1.11", "ruff>=0.17,<0.18", "mypy>=2.4", "types-PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["site"]

[tool.ruff.lint]
# Rules that catch mistakes, not matters of style: pyflakes (undefined names, unused imports
# and variables), pycodestyle's errors, bugbear (likely bugs, such as a function in a loop
# that reads the loop's variable later) and pylint's errors. Long lines are allowed.
select = ["F", "E4", "E7", "E9", "B", "PLE"]
# zip() without strict=: much of the code zips sequences of equal length by construction,
# and strict=True would turn a harmless difference into an error at run time.
ignore = ["B905"]

[tool.mypy]
python_version = "3.10"
files = ["src/onehealth"]
warn_unused_ignores = true
warn_redundant_casts = true
