[project]
name = "onehealth"
version = "0.1.0"
description = "Classify mixed NCBI isolate IDs into One Health source categories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bhargava-morampalli", email = "morampalli.b@northeastern.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The documentation site (mkdocs.yml); not needed to use onehealth.
docs = ["mkdocs-material>=9.5"]

[project.scripts]
onehealth = "onehealth.cli:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.15.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
